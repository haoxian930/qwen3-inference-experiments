name: Speculative decoding checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest ruff
      - name: Check added Python files
        run: python -m ruff check reasoning_from_scratch/speculative.py benchmarks tests/test_speculative.py tests/test_speculative_benchmark.py
      - name: Run focused correctness tests without pretrained downloads
        run: python -m pytest tests/test_speculative.py tests/test_speculative_benchmark.py -q
